<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10283c"><title>萌可乐园 · 六个好朋友</title><meta name="description" content="和六个萌可一起玩，旋转视角、近距离观察，挑战寻找萌可。"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%2310283c'/%3E%3Cpath d='M20 30L9 19C2 10 14 5 20 13C26 5 38 10 31 19Z' fill='%23ff6ba7'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head><body data-models="../models/">
<header><a class="brand" href="./"><span class="brand-icon">♥</span><div>萌可乐园<small>六个好朋友 · 3D PLAYGROUND</small></div></a><div class="top-actions"><a class="mode-link" href="../">竞速游戏</a><button id="auto" aria-pressed="false">自动环绕</button><button id="dance" aria-pressed="false">一起跳舞</button><button id="fullscreen" aria-label="全屏查看">⛶</button></div></header>
<main><div id="viewport" aria-label="六个萌可的可旋转三维场景"><canvas id="scene" tabindex="0" aria-label="拖动旋转场景，滚轮缩放，点击萌可互动"></canvas><div id="loading" role="status"><span class="loader"></span><strong>萌可们正在集合…</strong><span id="loadCount">0 / 6</span></div></div>
<section class="game-panel"><span class="eyebrow">一起玩</span><h1>找到那个萌可！</h1><p id="mission">点击开始，再去场景里找到它。</p><div id="gameStats" hidden><span>已找到 <b id="score">0</b>/6</span><span><b id="time">0</b> 秒</span></div><button id="play" class="primary" disabled>开始寻找</button><p class="game-note">拖动看一看，点击打个招呼</p></section>
<div class="view-tools" role="group" aria-label="选择观察角度"><span>视角</span><button data-view="front" class="active">正面</button><button data-view="left">左侧</button><button data-view="right">右侧</button><button data-view="back">背面</button><button data-view="top">俯视</button><button id="reset" title="显示全部六个萌可">全员集合</button></div>
<div id="toast" role="status" aria-live="polite"></div><div class="hint">拖动旋转 <i>·</i> 滚轮 / 双指缩放 <i>·</i> 点击萌可</div>
</main><footer><div class="roster-head"><span>认识六个好朋友</span><small>点击名字，靠近看看</small></div><nav id="roster" aria-label="选择萌可"></nav></footer><script type="module" src="app.js"></script></body></html>
